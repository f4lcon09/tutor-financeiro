<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutor Financeiro</title>
<meta name="theme-color" content="#070B14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tutor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#070B14; --p1:#0C1322; --p2:#121B2E; --ln:#1B2740; --ln2:#2B3A5C;
  --tx:#EAF0FA; --mu:#94A3C4;
  --teal:#2DE0C9; --vio:#9B8CFF; --pink:#FF6EB4; --sky:#4CC9FF;
  --ok:#3DDC97; --at:#FFC53D; --ru:#FF6B80;
  --f:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --fn:"Bahnschrift","Segoe UI Variable Display","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
nav{background:var(--p1);border-right:1px solid var(--ln);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:var(--fn);font-weight:600;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:3px;background:var(--teal);display:grid;place-items:center;color:#04130F;font-style:normal;font-weight:700}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:3px;color:var(--mu);font-size:14.5px;border-left:3px solid transparent}
nav button:hover{background:var(--p2);color:var(--tx)}
nav button[aria-current=true]{background:var(--p2);color:var(--tx);font-weight:600;border-left-color:var(--h,var(--teal))}
nav button[aria-current=true] svg{color:var(--h,var(--teal))}
nav svg{width:19px;height:19px;flex:none}
.demo{margin-top:auto;font-size:12px;color:var(--mu);border:1px dashed var(--ln2);border-radius:3px;padding:10px 12px}
main{padding:28px 32px 70px;max-width:1800px;width:100%}
h1{font-family:var(--fn);font-size:28px;font-weight:600;letter-spacing:.005em}
.sub{color:var(--mu);margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g32{grid-template-columns:2fr 1fr}
.g23{grid-template-columns:1fr 1.6fr}
.pn{background:var(--p1);border:1px solid var(--ln);border-left:3px solid var(--h,var(--ln2));border-radius:3px;padding:18px 18px 18px 20px;position:relative}
.pn h3{font-family:var(--fn);font-size:12.5px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.pn h3 em{font-style:normal;color:var(--h,var(--mu))}
.big{font-family:var(--fn);font-size:34px;font-weight:600;letter-spacing:-.005em;line-height:1.05}
.mid{font-family:var(--fn);font-size:22px;font-weight:600}
.mu{color:var(--mu)} .small{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:2px;font-size:12.5px;font-weight:600;letter-spacing:.01em}
.ok{color:var(--ok);background:rgba(61,220,151,.12)} .at{color:var(--at);background:rgba(255,197,61,.12)} .ru{color:var(--ru);background:rgba(255,107,128,.13)} .ne{color:var(--mu);background:var(--p2)}
.verdict{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:24px 26px;margin-bottom:14px}
.verdict .ico{width:62px;height:62px;border-radius:3px;display:grid;place-items:center;font-size:30px;font-weight:700}
.verdict h2{font-family:var(--fn);font-size:26px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--p2);margin:10px 0 6px;position:relative}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--h,var(--teal)) 55%,transparent),var(--h,var(--teal)))}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--ln2);color:var(--mu);font-size:10.5px;font-style:normal;font-family:var(--fn);font-weight:600;cursor:help;margin-left:7px;position:relative;vertical-align:middle;text-transform:none;letter-spacing:0}
.info:hover,.info:focus{color:var(--tx);border-color:var(--teal);outline:none}
.info:hover::after,.info:focus::after{content:attr(data-t);position:absolute;left:-8px;top:24px;width:270px;background:var(--p2);border:1px solid var(--ln2);padding:10px 12px;border-radius:3px;color:var(--tx);font-size:12.5px;font-family:var(--f);font-weight:400;line-height:1.45;z-index:40;white-space:normal;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.info.r:hover::after,.info.r:focus::after{left:auto;right:-8px}
.dica{font-size:13px;border:1px solid var(--ln2);border-left:3px solid var(--teal);border-radius:3px;padding:10px 12px;background:var(--p2);margin:-6px 0 16px}
.dica b{font-family:var(--fn);font-weight:600}
.guia{display:grid;gap:12px}
.guia .g{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding-top:12px;border-top:1px solid var(--ln)}
.guia .g:first-child{border-top:0;padding-top:0}
.pn.click{cursor:pointer;transition:border-color .15s}
.pn.click:hover{border-color:var(--h)}
.strip .c{cursor:pointer}
.strip .c:hover{border-color:var(--mu)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--p2)}
input[type=range]{padding:0;height:22px;background:transparent;border:0;accent-color:var(--h,var(--teal))}
.sl{margin-bottom:16px}
.sl label{display:flex;justify-content:space-between}
.sl label b{font-family:var(--fn);color:var(--tx)}
.tip{position:fixed;z-index:30;background:var(--p2);border:1px solid var(--ln2);border-radius:3px;padding:9px 12px;font-size:12.5px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tip b{font-family:var(--fn);font-weight:600;display:block;margin-bottom:4px}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.bar>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.8}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--ln)}
.ins:first-of-type{border-top:0;padding-top:0}
.ins .d{width:30px;height:30px;border-radius:3px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--p2);border:1px solid var(--ln2);border-radius:3px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--h,var(--teal))}
input[type=number]{font-family:var(--fn);font-size:16px}
.rate{display:grid;grid-template-columns:1fr 112px;gap:8px}
.hint{font-size:12.5px;color:var(--mu);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;border:1px solid var(--ln2);color:var(--mu);font-size:14px}
.chip:hover{color:var(--tx)}
.chip[aria-pressed=true]{background:var(--p2);border-color:var(--h,var(--teal));color:var(--tx);font-weight:600}
.seg{display:inline-flex;background:var(--p1);border:1px solid var(--ln);border-radius:3px;margin-bottom:18px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:9px 16px;color:var(--mu);font-weight:500;border-right:1px solid var(--ln)}
.seg button:last-child{border-right:0}
.seg button[aria-selected=true]{background:var(--p2);color:var(--tx);box-shadow:inset 0 -2px 0 var(--h,var(--teal));font-weight:600}
.btn{all:unset;cursor:pointer;background:var(--h,var(--teal));color:#06101A;font-family:var(--fn);font-weight:600;letter-spacing:.03em;padding:11px 20px;border-radius:3px;text-align:center}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln2)}
.toggle{display:flex;gap:10px}
.toggle label{flex:1;display:flex;align-items:center;gap:8px;margin:0;background:var(--p2);border:1px solid var(--ln2);border-radius:3px;padding:10px 12px;cursor:pointer;color:var(--tx);font-size:14px}
.toggle input{accent-color:var(--h,var(--teal))}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--fn);font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:500;text-align:left;padding:8px 8px;border-bottom:1px solid var(--ln2)}
td{padding:10px 8px;border-bottom:1px solid var(--ln)}
td.n,th.n{text-align:right;font-family:var(--fn);font-size:15px}
tr:last-child td{border-bottom:0}
.x{all:unset;cursor:pointer;color:var(--mu);padding:2px 8px;border-radius:3px}.x:hover{background:rgba(255,107,128,.13);color:var(--ru)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mu)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.res{background:var(--p2);border-radius:3px;border-left:3px solid var(--h,var(--teal));padding:16px 18px;margin-bottom:16px}
.res .big{margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--mu)} .kv span:nth-child(even){text-align:right;font-family:var(--fn);font-size:15px}
svg text{font-family:var(--f)}
.disc{font-size:12.5px;color:var(--mu);border-left:2px solid var(--ln2);padding:2px 0 2px 12px;margin-top:14px}
.factor{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--ln)}
.factor:first-of-type{border-top:0}
.factor .bar{grid-column:1/-1;margin:2px 0 0;height:6px}
/* faixa do mês */
.strip{display:grid;gap:3px}
.strip .c{height:38px;border-radius:2px;background:var(--p2);position:relative;border:1px solid transparent}
.strip .c{cursor:pointer;transition:transform .12s,box-shadow .12s}
.strip .c:hover{box-shadow:0 0 0 1px var(--mu);transform:translateY(-2px)}
.strip .c.hj{border-color:var(--tx)}
.strip .c.sel{box-shadow:0 0 0 2px var(--teal),0 0 14px rgba(45,212,191,.45);transform:translateY(-3px);z-index:2}
.strip .c.sel::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-4px;border:4px solid transparent;border-top:0;border-bottom:5px solid var(--teal)}
.strip .l.sel{color:var(--teal);font-weight:700}
tr.clk.sel td{background:var(--p2)}
tr.clk.sel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.strip .c.fut{background:transparent;border:1px dashed var(--ln2)}
.strip .c b{position:absolute;left:50%;top:5px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--vio)}
.strip .l{font-family:var(--fn);font-size:11px;color:var(--mu);text-align:center;margin-top:4px}
/* cartão */
.card3d{border-radius:6px;padding:20px;background:var(--p2);border:1px solid var(--ln2);position:relative;overflow:hidden;min-height:170px}
.card3d .chip2{width:38px;height:28px;border-radius:5px;border:1px solid var(--ln2);background:var(--p1);margin-bottom:18px}
.card3d:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(155,140,255,.14)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{font-family:var(--fn);font-size:11px;color:var(--mu);text-align:center;letter-spacing:.08em;padding-bottom:2px}
.cal .d{min-height:56px;border:1px solid var(--ln);border-radius:2px;padding:4px 6px;font-family:var(--fn);font-size:12px;color:var(--mu)}
.cal .d.hj{border-color:var(--tx);color:var(--tx)}
.cal .d.v{background:var(--p2)}
.cal .d b{display:block;font-weight:500;font-size:10.5px;color:var(--vio);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .d b.pg{color:var(--ok)}
.vb{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:8px}
.vb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.vb>div>span{width:100%;border-radius:2px 2px 0 0;background:var(--h,var(--vio))}
.vb small{font-family:var(--fn);font-size:11.5px;color:var(--mu)}
.vb em{font-style:normal;font-family:var(--fn);font-size:12px}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 26px}
.gl b{display:block;font-family:var(--fn);font-weight:600;letter-spacing:.02em}
.screen{display:none}.screen.on{display:block}
.sync{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:20;display:flex;align-items:center;gap:7px;font-family:var(--fn);font-size:12px;letter-spacing:.02em;color:var(--mu);background:var(--p1);border:1px solid var(--ln2);border-radius:14px;padding:6px 12px;cursor:pointer;user-select:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.sync.ok i{background:var(--ok)} .sync.at i{background:var(--at)} .sync.ru i{background:var(--ru)} .sync.go i{background:var(--sky);animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.3}}
.sync:hover{border-color:var(--teal);color:var(--tx)}
@media(max-width:860px){
  html{-webkit-text-size-adjust:100%}
  input,select,textarea{font-size:16px !important}
  button,.chip,.btn{min-height:40px}
  nav{padding-bottom:calc(6px + env(safe-area-inset-bottom)) !important}
  main{padding-top:calc(52px + env(safe-area-inset-top)) !important}
  .sync{right:10px}
  table{font-size:13px}
  .pn{overflow-x:auto}
  th,td{padding-left:6px !important;padding-right:6px !important}
  th{font-size:10.5px !important;letter-spacing:.04em}
  table:has(tr[data-cat]) th:nth-child(2),table:has(tr[data-cat]) td:nth-child(2){display:none}
  table input[type=number]{width:72px !important}
  .verdict .ico,.verdict>div:first-child svg{max-width:64px}
  .app{grid-template-columns:minmax(0,1fr)}
  main{min-width:0;overflow-x:hidden}
  nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 4px;border-right:0;border-top:1px solid var(--ln);z-index:5;overflow-x:auto;gap:0}
  nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 10px;border-left:0;border-top:3px solid transparent;min-width:64px;align-items:center}
  nav button[aria-current=true]{border-left-color:transparent;border-top-color:var(--h,var(--teal))}
  .brand,.demo{display:none}
  .g32,.g23{grid-template-columns:1fr}
  main{padding:20px 14px 100px}
  h1{font-size:23px} .verdict{grid-template-columns:1fr} .big{font-size:29px}
}
</style>
</head>
<body>
<div class="sync" id="sync" role="button" tabindex="0" title="Sincronização com o Google Drive"><i></i><span>…</span></div>
<div class="app">
<nav aria-label="Principal" id="nav"></nav>
<main id="main"></main>
</div>
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="real.js"></script>
<script src="sync.js"></script>
<script>
/* ===== Dados de EXEMPLO (fictícios). Na versão real vêm da planilha (somente leitura) e de arquivos do app. ===== */
const DEMO = {
  caixinha: 1950, conta: 400, essencial: 1600, renda: 3800,
  meta: 3000, piso: 2500, alerta: 1900, tetoLazer: 200,
  meses: ['nov/26','dez/26','jan/27','fev/27','mar/27','abr/27','mai/27','jun/27','jul/27','ago/27','set/27','out/27'],
  cenarios: {
    'Base':       [2350,2100,3150,3520,3890,4250,4640,5020,5410,5790,6160,6540],
    'Pessimista': [2350,1700,2150,2350,2600,2850,3100,3350,3600,3850,4100,4350],
    'Otimista':   [2350,2300,3500,3950,4400,4850,5300,5750,6200,6650,7100,7550],
    'Sua regra':  [2350,2000,3050,3400,3750,4100,4450,4800,5150,5500,5850,6200]
  },
  cores: {'Base':'#4CC9FF','Pessimista':'#FF6B80','Otimista':'#3DDC97','Sua regra':'#FFC53D'},
  carteira: [
    {nome:'Caixinha (CDB liquidez diária)',classe:'Renda fixa',valor:1950,liquidez:'diaria'},
    {nome:'Tesouro Selic',classe:'Renda fixa',valor:1200,liquidez:'diaria'},
    {nome:'ETF de índice',classe:'Ações',valor:900,liquidez:'media'},
    {nome:'Cripto',classe:'Cripto',valor:250,liquidez:'media'}
  ],
  cartoes: [
    {id:'c1',nome:'Cartão principal',final:'4821',limite:6000,fatura:780,parcelasFuturas:2320,fecha:3,vence:10},
    {id:'c2',nome:'Cartão 2',final:'1107',limite:1500,fatura:200,parcelasFuturas:0,fecha:20,vence:27}
  ],
  parcelamentos: [
    {nome:'Notebook',parcela:210,restam:5,total:10},
    {nome:'Celular',parcela:90,restam:9,total:12},
    {nome:'Curso online',parcela:115,restam:4,total:6}
  ],
  agenda: [
    {id:'a1',nome:'Faculdade',dia:5,valor:650},
    {id:'a2',nome:'Academia',dia:8,valor:90},
    {id:'a3',nome:'Fatura do cartão principal',dia:10,valor:780},
    {id:'a4',nome:'Parcela do notebook',dia:12,valor:210},
    {id:'a5',nome:'Assinaturas',dia:15,valor:80},
    {id:'a6',nome:'Celular (plano)',dia:20,valor:40},
    {id:'a7',nome:'Ajuda em casa',dia:25,valor:400}
  ],
  tetos: {Mercado:800,Transporte:150,Estudos:650,'Saúde':120,Outros:100}
};
const HUE = {teal:'#2DE0C9',vio:'#9B8CFF',pink:'#FF6EB4',sky:'#4CC9FF'};
const CATS = ['Lazer','Jogos','Comida','Mercado','Transporte','Estudos','Saúde','Outros'];
const brl = n => (n==null||isNaN(n)) ? '—' : n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0 = n => (n==null||isNaN(n)) ? '—' : n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const pc = (n,d=2) => (n==null||isNaN(n)) ? '—' : (n*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const num1 = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const ST = {ok:['✔','Tudo certo'],at:['⚠','Atenção'],ru:['✖','Risco']};
const stCls = s => s==='atencao'?'at':s==='ruim'?'ru':s;

/* ===== Armazenamento da maquete (versão real: arquivos do app, no computador) ===== */
function load(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?def:v; }catch(e){ return def; } }
function save0(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function save(k,v){ save0(k,v); if(window.mudou) mudou(); }
const MODO = load('tf_modo',null);   // 'real' | 'demo' | null (ainda sem dados)
let real = load('tf_real',null);
if(MODO==='real' && real) Object.assign(DEMO, Real.derivar(real));
const hoje = new Date(); const diaHoje = hoje.getDate();
const mesAtual = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0');
const diasMes = new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();
function prevSeed(){
  const dt=new Date(hoje.getFullYear(),hoje.getMonth()-1,1), k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');

function axisFmt(v){ return Math.abs(v)>=1000 ? 'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : 'R$ '+Math.round(v); }

function CW(f){ const w=Math.max(window.innerWidth-(window.innerWidth<=860?28:224+64),320); return Math.round(Math.min(w,1736)*f-44); }
function lineChart(labels, series, refs, h=280, W=720, o={}){
  const id='ch'+Math.random().toString(36).slice(2,8);
  const H=h, L=62, R=18, T=22, B=34;
  const all=[...series.flatMap(s=>s.values), ...refs.map(r=>r.v)];
  let mn=Math.min(...all), mx=Math.max(...all); const pad=(mx-mn)*.08||1; mn=Math.max(0,mn-pad); mx+=pad;
  const x=i=>L+(W-L-R)*i/(labels.length-1), y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g='<defs>'+series.map((s,k)=>s.area?`<linearGradient id="${id}g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".38"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient>`:'').join('')+'</defs>';
  (o.zones||[]).forEach(z=>{ const y1=y(Math.min(z.to,mx)), y2=y(Math.max(z.from,mn)); if(y2>y1) g+=`<rect x="${L}" y="${y1}" width="${W-L-R}" height="${y2-y1}" fill="${z.c}" opacity="${z.o||.07}"/>`; });
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1B2740"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#94A3C4">${axisFmt(v)}</text>`;}
  const step=Math.max(1,Math.ceil(labels.length/Math.max(Math.floor((W-L-R)/70),2)));
  labels.forEach((lb,i)=>{ if(i%step===0) g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="12" fill="#94A3C4">${lb}</text>`; });
  refs.forEach(r=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c}" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${W-R-4}" y="${y(r.v)-7}" text-anchor="end" font-size="12" font-weight="600" fill="${r.c}">${r.t}</text>`; });
  series.forEach((s,k)=>{
    const d=s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    if(s.area) g+=`<path d="${d} L${x(s.values.length-1)} ${H-B} L${x(0)} ${H-B}Z" fill="url(#${id}g${k})"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const i=s.values.length-1; g+=`<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.c}"/>`;
  });
  (o.marks||[]).forEach(m=>{ const cx=x(m.i), cy=y(m.v), up=m.pos!=='b', anc=cx<L+80?'start':cx>W-R-80?'end':'middle';
    g+=`<circle cx="${cx}" cy="${cy}" r="6" fill="${m.c}" stroke="#070B14" stroke-width="2.5"/><text x="${cx}" y="${up?cy-14:cy+24}" text-anchor="${anc}" font-size="12.5" font-weight="700" fill="${m.c}">${m.t}</text>`; });
  CHARTS[id]={labels,series,x:null,W,L,R};
  return `<svg data-ch="${id}" viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block">${g}</svg>`;
}
function ring(pct,color,label,sub,size=150){

function bindLancar(){
  let cat='Lazer', tipo='saida';
  const setCat=c=>{ cat=c; $$('#f_cat .chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===c)); };
  const aplica=()=>{ if(editId!=null){ $('#dica').innerHTML='<b>Editando.</b> Ajuste os marcadores se a classificação estiver errada.'; return; }
    const sg=sugerir(cat,$('#f_desc').value); $('#f_ess').checked=sg.ess; $('#f_laz').checked=sg.laz&&tipo==='saida';
    $('#dica').innerHTML=sg.t+' <span class="mu">Sugestão automática: você pode mudar os marcadores.</span>'; };
  const setTipo=t=>{ tipo=t; $$('#tipo button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t)); };
  const reset=()=>{ editId=null; $('#f_valor').value=''; $('#f_desc').value=''; $('#f_data').value=mesAtual+'-'+pad2(diaHoje); $('#f_ess').checked=false; $('#f_laz').checked=true; setTipo('saida'); setCat('Lazer'); $('#ftitle').textContent='Novo lançamento'; $('#f_ok').textContent='SALVAR LANÇAMENTO'; $('#f_cancel').style.display='none'; aplica(); };
  $$('#freq .chip').forEach(b=>b.onclick=()=>{ const f=FREQ[+b.dataset.i]; reset(); $('#f_valor').value=f.valor; $('#f_desc').value=f.desc; setCat(f.cat); $('#f_forma').value=f.forma; $('#f_laz').checked=f.lazer; $('#f_valor').focus(); });
  $$('#tipo button').forEach(b=>b.onclick=()=>{ setTipo(b.dataset.t); if(b.dataset.t==='entrada'){ $('#f_laz').checked=false; $('#f_ess').checked=false; $('#dica').innerHTML='<b>Entrada é dinheiro que chegou</b> (salário, repasse, extra). Não é essencial nem lazer.'; } else aplica(); });
  $$('#f_cat .chip').forEach(b=>b.onclick=()=>{ setCat(b.dataset.c); aplica(); });
  $('#f_desc').oninput=()=>{ if(cat==='Comida') aplica(); };
  aplica();
  $('#f_ok').onclick=()=>{
    const v=parseFloat($('#f_valor').value); if(!(v>0)){ $('#f_msg').textContent='Digite um valor maior que zero.'; return; }
    if(!$('#f_data').value){ $('#f_msg').textContent='Escolha a data.'; return; }
    const obj={data:$('#f_data').value,desc:$('#f_desc').value||cat,cat,valor:tipo==='entrada'?-v:v,forma:$('#f_forma').value,essencial:$('#f_ess').checked,lazer:$('#f_laz').checked&&tipo==='saida'};
    const editando=editId!=null;
    if(editando){ lanc=lanc.map(l=>String(l.id)===String(editId)?{...obj,id:l.id}:l); } else { lanc.push({...obj,id:Date.now()}); }
    mesVer=obj.data.slice(0,7); saveLanc(); reset(); $('#f_msg').textContent=editando?'✔ Alteração salva.':'✔ Salvo.'; drawLista();
  };
  $('#f_cancel').onclick=()=>{ reset(); $('#f_msg').textContent=''; drawLista(); };
  startEditFn=id=>{ const l=lanc.find(x=>String(x.id)===String(id)); if(!l) return; editId=l.id;
    $('#f_valor').value=Math.abs(l.valor); $('#f_desc').value=l.desc; $('#f_data').value=l.data; $('#f_forma').value=l.forma; $('#f_ess').checked=l.essencial; $('#f_laz').checked=l.lazer;
    setTipo(l.valor<0?'entrada':'saida'); setCat(l.cat); $('#ftitle').textContent='Corrigir lançamento'; $('#f_ok').textContent='SALVAR ALTERAÇÃO'; $('#f_cancel').style.display=''; $('#f_msg').textContent='Corrija o que precisar e salve.'; aplica();
    window.scrollTo(0,0); drawLista(); };
  $('#busca').oninput=()=>drawLista();
  if(prefillData){ $('#f_data').value=prefillData; prefillData=null; }
  $('#mprev').onclick=()=>{ mesVer=mesMove(mesVer,-1); drawLista(); };
  $('#mnext').onclick=()=>{ mesVer=mesMove(mesVer,1); drawLista(); };
  $('#exp').onclick=()=>{
    const q=t=>/[",\n]/.test(t)?'"'+String(t).replace(/"/g,'""')+'"':t;
    const rows=['data,descricao,categoria,valor,forma,essencial,mes,conta_no_lazer',...lanc.slice().sort((x,y)=>x.data.localeCompare(y.data)).map(l=>[l.data,q(l.desc),l.cat,l.valor.toFixed(2),l.forma||'',l.essencial?'Sim':'Não',l.data.slice(0,7),l.lazer?'Sim':'Não'].join(','))];
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'})); a.download='lancamentos_reais_'+mesAtual+'.csv'; a.click();
  };
  drawLista();
}
function drawLista(){
  const doM=lanc.filter(l=>l.data.startsWith(mesVer)), g=doM.filter(l=>l.lazer&&l.valor>0).reduce((s,l)=>s+l.valor,0), pct=g/DEMO.tetoLazer, cls=pct<=.75?'ok':pct<=1?'at':'ru';
  $('#mnome').textContent=mesTitulo(mesVer);
  $('#lz_resumo').innerHTML=`<div class="row"><span class="mu small">Lazer: ${brl(g)} de ${brl0(DEMO.tetoLazer)}</span><span class="tag ${cls}">${ST[cls][0]} ${pct>1?'passou '+brl0(g-DEMO.tetoLazer):brl0(DEMO.tetoLazer-g)+' restantes'}</span></div><div class="bar" style="--h:${COR[cls]}"><span style="width:${Math.min(pct,1)*100}%"></span></div>`;
  const q=(($('#busca')||{}).value||'').toLowerCase().trim();
  const rows=[...doM].filter(l=>!q||(l.desc+' '+l.cat+' '+(l.forma||'')).toLowerCase().includes(q)).sort((a,b)=>b.data.localeCompare(a.data));
  $('#lista').innerHTML = rows.length ? `<table><tr><th>Dia</th><th>O que</th><th class="n">Valor</th><th></th></tr>${rows.map(l=>`<tr style="${String(l.id)===String(editId)?'background:var(--p2)':''}"><td>${l.data.slice(8)}</td><td>${l.desc}<div class="mu small">${l.cat}${l.lazer?' · lazer':''}${l.forma?' · '+l.forma:''}</div></td><td class="n" style="color:${l.valor<0?'var(--ok)':'inherit'}">${l.valor<0?'+':''}${brl(Math.abs(l.valor))}</td><td style="white-space:nowrap"><button class="x" data-ed="${l.id}" title="Corrigir" aria-label="Corrigir">✎</button><button class="x" data-id="${l.id}" title="Apagar" aria-label="Apagar">✕</button></td></tr>`).join('')}</table>` : '<div class="mu">Nenhum lançamento neste mês.</div>';
  if(q) $('#lista').insertAdjacentHTML('beforeend',`<div class="hint">${rows.length} resultado(s) · total ${brl(rows.reduce((s,l)=>s+Math.abs(l.valor),0))}</div>`);
  $$('#lista [data-ed]').forEach(b=>b.onclick=()=>startEditFn&&startEditFn(b.dataset.ed));
  $$('#lista [data-id]').forEach(b=>b.onclick=()=>{ lastDel=lanc.find(l=>String(l.id)===b.dataset.id); lanc=lanc.filter(l=>String(l.id)!==b.dataset.id); if(String(editId)===b.dataset.id) editId=null; saveLanc(); drawLista();
    $('#f_msg').innerHTML='Lançamento apagado. <a href="#" id="undo" style="color:var(--teal)">Desfazer</a>'; $('#undo').onclick=e=>{ e.preventDefault(); if(lastDel){ lanc.push(lastDel); lastDel=null; saveLanc(); drawLista(); $('#f_msg').textContent='✔ Desfeito.'; } }; });
}

function bindOrc(){

/* --- Metas --- */
T.metas = () => {
  const i=Calc.mensal(taxaMeta,'m');
  const cards=metas.map(m=>{
    const [ay,am]=m.prazo.split('-').map(Number), n=Math.max((ay-hoje.getFullYear())*12+(am-1-hoje.getMonth()),0);
    const need=Calc.metaAporte(m.alvo,m.guardado,i,n), eta=Calc.mesesParaMeta(m.alvo,m.guardado,m.aporte,i);
    const k = m.guardado>=m.alvo?'ok': m.aporte>=need*.999?'ok': m.aporte>=need*.7?'at':'ru', pct=m.guardado/m.alvo;
    const txt = m.guardado>=m.alvo?'✔ Meta atingida': k==='ok'?'✔ No ritmo': k==='at'?'⚠ Um pouco abaixo':'✖ Fora do ritmo';
    return pn(m.nome,`<div class="row" style="align-items:center;gap:16px"><div>${ring(Math.min(pct,1),HUE.sky,Math.round(pct*100)+'%','',110)}</div>
      <div style="flex:1"><div class="mu small">Guardado</div><div class="mid">${brl0(m.guardado)} <span class="mu small">de ${brl0(m.alvo)}</span></div><span class="tag ${k}" style="margin-top:8px">${txt}</span></div></div>
      <div class="kv" style="margin-top:14px"><span>Prazo</span><span>${String(am).padStart(2,'0')}/${ay} (${n} meses)</span><span>Precisa guardar por mês</span><span>${brl0(need)}</span><span>Você planeja guardar</span><span>${brl0(m.aporte)}</span><span>Chega lá em</span><span>${eta==null?'—':eta+' meses'}</span></div>
      <div style="margin-top:14px;border-top:1px solid var(--ln);padding-top:12px" class="sl"><label><span>Guardar por mês (arraste para testar)</span><b id="sv${m.id}">${brl0(m.aporte)}</b></label><input type="range" data-ap="${m.id}" min="0" max="${Math.max(Math.ceil(Math.max(need*2,m.aporte)/50)*50,1000)}" step="10" value="${m.aporte}" style="width:100%;--h:#4CC9FF"></div>
      <div class="row" style="gap:8px"><input type="number" data-dep="${m.id}" placeholder="Guardei hoje (R$)" min="0" step="10" style="flex:1"><button class="btn ghost" data-depb="${m.id}">Adicionar</button></div>
      <div class="row" style="margin-top:12px"><span class="hint">${k==='ok'?'':'Faltam '+brl0(Math.max(need-m.aporte,0))+' por mês para chegar no prazo.'}</span><button class="x" data-del="${m.id}">Remover</button></div>`,'sky');
  }).join('');
  return `<div class="head"><div><h1>Metas</h1><div class="sub">Quanto guardar por mês para chegar lá no prazo.</div></div>
    <div style="width:260px"><label>Rendimento esperado do que você guarda (ao mês, %) ${info('Quanto o dinheiro guardado rende por mês. Se não souber, deixe 0 para uma conta conservadora ou use a taxa do seu CDB ou poupança.',true)}</label><input type="number" id="tx" value="${taxaMeta}" step="0.05" min="0"></div></div>
  <div class="grid g3" style="margin-bottom:14px">${cards}</div>
  ${metasResumo(i)}
  ${pn('Nova meta',`<div class="grid g4"><div class="field"><label>Nome</label><input type="text" id="m_n" placeholder="Ex.: curso, moto, reserva"></div><div class="field"><label>Quanto quer juntar (R$)</label><input type="number" id="m_a" min="0" step="100"></div><div class="field"><label>Já tem (R$)</label><input type="number" id="m_g" min="0" step="50" value="0"></div><div class="field"><label>Prazo</label><input type="month" id="m_p" style="width:100%;background:var(--p2);border:1px solid var(--ln2);border-radius:3px;padding:10px 12px;color:var(--tx)"></div><div class="field"><label>Guarda por mês (R$)</label><input type="number" id="m_m" min="0" step="10" value="100"></div></div><button class="btn" id="m_ok" style="--h:#4CC9FF">ADICIONAR META</button><div class="hint" id="m_msg"></div>`,'sky')}`;
};
function bindMetas(){
  $$('[data-ap]').forEach(r=>{ r.oninput=()=>{ $('#sv'+r.dataset.ap).textContent=brl0(+r.value); }; r.onchange=()=>{ const m=metas.find(x=>String(x.id)===r.dataset.ap); if(m){ m.aporte=+r.value; save('tf_metas',metas); ir('metas'); } }; });
  $$('[data-depb]').forEach(b=>b.onclick=()=>{ const inp=$('[data-dep="'+b.dataset.depb+'"]'), v=parseFloat(inp.value); if(!(v>0)) return; const m=metas.find(x=>String(x.id)===b.dataset.depb); m.guardado+=v; save('tf_metas',metas); ir('metas'); });
  $('#tx').onchange=()=>{ taxaMeta=parseFloat($('#tx').value)||0; save('tf_taxameta',taxaMeta); ir('metas'); };
  $$('[data-del]').forEach(b=>b.onclick=()=>{ metas=metas.filter(m=>String(m.id)!==b.dataset.del); save('tf_metas',metas); ir('metas'); });
  $('#m_ok').onclick=()=>{ const a=parseFloat($('#m_a').value), p=$('#m_p').value;
    if(!$('#m_n').value||!(a>0)||!p){ $('#m_msg').textContent='Preencha nome, valor e prazo.'; return; }
    metas.push({id:Date.now(),nome:$('#m_n').value,alvo:a,guardado:parseFloat($('#m_g').value)||0,prazo:p,aporte:parseFloat($('#m_m').value)||0}); save('tf_metas',metas); ir('metas'); };
}

let cenSel='Base', cmpAll=false;

T.futuro = () => `

  <div id="fut"></div>`;
function drawFuturo(){

  const series = cmpAll

    : [{name:cenSel,values:v,c:d.cores[cenSel],w:3.5,area:true}];

  if(minI!==2) marks.push({i:minI,v:minV,t:'mais apertado '+brl0(minV),c:COR.at,pos:'b'});
  const refs=[{v:d.meta,t:'Meta (17/01)',c:'#3DDC97'},{v:d.piso,t:'Piso (17/01)',c:'#FFC53D'},{v:d.alerta,t:'Alerta (fim de dez)',c:'#FF6B80'}];
  const dfa=minV-d.alerta;
  $('#fut').innerHTML=`
  <div class="grid g4" style="margin-bottom:14px">
    ${pn('Saldo fim de dez',`<div class="big">${brl0(dez)}</div><span class="tag ${dez>=d.alerta?'ok':'ru'}">${dez>=d.alerta?'✔ Acima do alerta':'✖ Abaixo do alerta'}</span>`,'sky')}
    ${pn('Saldo fim de jan',`<div class="big" style="color:${COR[cls]}">${brl0(jan)}</div><span class="tag ${cls}">${icn} ${txt}</span>`,'sky')}
    ${pn('Folga contra a meta',`<div class="big" style="color:${jan-d.meta>=0?COR.ok:COR.ru}">${jan-d.meta>=0?'+':''}${brl0(jan-d.meta)}</div><div class="mu small">meta ${brl0(d.meta)}</div>`,'sky')}
    ${pn('Atinge a meta em',`<div class="big">${alvo<0?'depois de '+d.meses[11]:d.meses[alvo]}</div><div class="mu small">primeiro mês acima da meta</div>`,'sky')}
  </div>
  <div class="grid g32" style="margin-bottom:14px">
    ${pn(cmpAll?'Todos os cenários':'Saldo previsto: '+cenSel,lineChart(d.meses,series,refs,360,CW(.66),{zones:zonesFut(),marks})+`<div class="legend"><span><i style="background:#3DDC97;height:10px;opacity:.5"></i>acima da meta</span><span><i style="background:#FFC53D;height:10px;opacity:.5"></i>entre piso e meta</span><span><i style="background:#FF6B80;height:10px;opacity:.5"></i>abaixo do piso</span>${cmpAll?todos.map(c=>`<span><i style="background:${d.cores[c]}"></i>${c}</span>`).join(''):''}</div>`,'sky')}
    ${pn('Leitura do cenário'+info('Meta e piso vêm da planilha: a meta é o saldo que você quer ter em 17/01 e o piso é o mínimo aceitável. O alerta é o saldo mínimo de segurança em dezembro.',true),`
      <div class="ins"><div class="d ${cls}">${icn}</div><div class="small"><b>Janeiro termina ${jan>=d.meta?'acima da meta':jan>=d.piso?'entre o piso e a meta':'abaixo do piso'}</b><div class="mu">${jan-d.meta>=0?'Sobram '+brl0(jan-d.meta)+' além da meta.':'Faltam '+brl0(d.meta-jan)+' para a meta e '+(jan>=d.piso?'você está '+brl0(jan-d.piso)+' acima do piso.':brl0(d.piso-jan)+' para o piso.')}</div></div></div>
      <div class="ins"><div class="d ${dfa>=0?'ok':'ru'}">${dfa>=0?'✔':'✖'}</div><div class="small"><b>Mês mais apertado: ${d.meses[minI]}</b><div class="mu">Saldo de ${brl0(minV)}, ${dfa>=0?brl0(dfa)+' acima':brl0(-dfa)+' abaixo'} do alerta. Evite compras grandes nesse mês.</div></div></div>
      <div class="ins"><div class="d ne">↗</div><div class="small"><b>Depois de janeiro o saldo cresce ${brl0(cresc)} por mês</b><div class="mu">Em média, de jan/27 até ${d.meses[11]}. Chega a ${brl0(v[11])} no fim.</div></div></div>
      <div class="disc">Previsão feita pela planilha com as premissas de cada cenário. Não é promessa.</div>`,'sky')}
  </div>
  ${pn('E se...? Simulador'+info('Teste o efeito de gastar mais, economizar, ter uma entrada extra ou fazer uma compra grande. O gráfico mostra o cenário original e o novo.'),'<div id="sim">'+simHtml()+'</div>','teal','margin-bottom:14px')}
  ${pn('Cenários lado a lado',`<table><tr><th>Cenário</th><th class="n">Dez</th><th class="n">Jan</th><th>Faixa de janeiro</th><th>Mês mais apertado</th><th class="n">Fim de ${d.meses[11]}</th></tr>
   ${todos.map(c=>{const s=d.cenarios[c],[k,i,t]=status(s[2],d.meta,d.piso), mi=s.indexOf(Math.min(...s));return `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${d.cores[c]};margin-right:8px"></span>${c}</td><td class="n">${brl0(s[1])}</td><td class="n">${brl0(s[2])}</td><td><span class="tag ${k}">${i} ${t}</span></td><td>${d.meses[mi]} · ${brl0(s[mi])}</td><td class="n">${brl0(s[11])}</td></tr>`}).join('')}</table>`,'sky')}`;
  bindSim();
}

    const jan=adj[2], [cls,icn,txt]=status(jan,d.meta,d.piso), dj=jan-v[2], mn=Math.min(...adj), mi=adj.indexOf(mn);
    const mudou=simS.gasto||simS.entrada||simS.compra;
    $('#simout').innerHTML=`<div class="grid g32" style="margin-top:6px">
      <div>${lineChart(d.meses,[{name:'Original',values:v,c:'#94A3C4',w:2},{name:'Com a mudança',values:adj,c:d.cores[cenSel],w:3.5,area:true}],[{v:d.meta,t:'Meta (17/01)',c:'#3DDC97'},{v:d.piso,t:'Piso (17/01)',c:'#FFC53D'},{v:d.alerta,t:'Alerta (fim de dez)',c:'#FF6B80'}],300,CW(.66)-10,{zones:zonesFut(),marks:[{i:2,v:jan,t:'jan '+brl0(jan),c:COR[cls],pos:'t'}]})}</div>
      <div><div class="kv"><span>Janeiro com a mudança</span><span style="color:${COR[cls]}">${brl0(jan)}</span><span>Diferença contra o original</span><span style="color:${dj>=0?COR.ok:COR.ru}">${dj>=0?'+':''}${brl0(dj)}</span><span>Contra a meta</span><span>${jan-d.meta>=0?'+':''}${brl0(jan-d.meta)}</span><span>Mês mais apertado</span><span>${d.meses[mi]} · ${brl0(mn)}</span></div>
      <span class="tag ${cls}" style="margin-top:12px">${icn} ${txt}</span>
      <div class="disc">${mudou?'Estimativa do app: soma o efeito mês a mês ao cenário da planilha. A planilha tem as regras reais (freios, rendimento), então use como ordem de grandeza.':'Mexa nos controles para ver o efeito no saldo.'}</div>
      <button class="btn ghost" id="s_r" style="margin-top:12px">Limpar simulação</button></div></div>`;
    $('#s_r').onclick=()=>{ simS.gasto=0; simS.entrada=0; simS.compra=0; simS.mes=1; $('#fut').querySelector('#sim').innerHTML=simHtml(); bindSim(); };
  };
  $('#s_g').oninput=e=>{ simS.gasto=+e.target.value; draw(); };
  $('#s_e').oninput=e=>{ simS.entrada=+e.target.value; draw(); };
  $('#s_c').oninput=e=>{ simS.compra=+e.target.value; draw(); };
  $('#s_m').onchange=e=>{ simS.mes=+e.target.value; draw(); };
  draw();
}

/* ===== Dica ao passar o mouse nos gráficos ===== */
const tip=document.createElement('div'); tip.className='tip'; tip.style.display='none'; document.body.appendChild(tip);
document.addEventListener('mousemove',e=>{
  const sv=e.target.closest&&e.target.closest('svg[data-ch]'); $$('svg .hv').forEach(n=>n.remove());
  if(!sv){ tip.style.display='none'; return; }
  const c=CHARTS[sv.dataset.ch]; if(!c){ tip.style.display='none'; return; }
  const r=sv.getBoundingClientRect(), vx=(e.clientX-r.left)*(c.W/r.width), n=c.labels.length;
  const i=Math.max(0,Math.min(n-1,Math.round((vx-c.L)/(c.W-c.L-c.R)*(n-1)))), px=c.L+(c.W-c.L-c.R)*i/(n-1);
  const vh=sv.viewBox.baseVal.height;
  const ln=document.createElementNS('http://www.w3.org/2000/svg','line'); ln.setAttribute('class','hv'); ln.setAttribute('x1',px); ln.setAttribute('x2',px); ln.setAttribute('y1',10); ln.setAttribute('y2',vh-34); ln.setAttribute('stroke','#94A3C4'); ln.setAttribute('stroke-dasharray','3 4'); sv.appendChild(ln);
  tip.innerHTML='<b>'+c.labels[i]+'</b>'+c.series.filter(s=>s.name).map(s=>`<div><i style="background:${s.c}"></i>${s.name}: <span style="font-family:var(--fn)">${brl0(s.values[i])}</span></div>`).join('');
  tip.style.display='block'; tip.style.left=Math.min(e.clientX+16,window.innerWidth-220)+'px'; tip.style.top=(e.clientY+16)+'px';
});

/* ===== Sincronização com o Google Drive =====
   Fonte única: dados.json na pasta "Tutor Financeiro" do Drive. Cada aparelho guarda uma cópia local e junta por item. */
const estado = () => ({lanc, pagos, tetos, metas, taxa:taxaMeta, real:MODO==='real'?real:undefined});
const BASE = TFSync.baseItens({lanc:MODO==='demo'?seed():[], pagos:{}, tetos:{...DEMO.tetos}, metas:MODO==='demo'?metasPadrao():[], taxa:0.8});
const arm = {get:k=>load(k,null), set:save0, del:k=>{ try{ localStorage.removeItem(k); }catch(e){} }};
const Drive = TFSync.criarDrive(window.TF_CONFIG||{}, arm);
let sincStatus = {t:'off'}, sincOcupado = false, sincTimer = null;

function capturar(){
  const itens = TFSync.semBase(TFSync.atualizar(estado(), TFSync.juntar(BASE, load('tf_items',{})), Date.now()));
  save0('tf_items', itens); return itens;
}
function aplicarEstado(st){
  lanc=st.lanc; pagos=st.pagos; tetos=st.tetos; metas=st.metas; taxaMeta=st.taxa==null?0.8:st.taxa;
  if(st.real!==undefined){ real=st.real; save0('tf_real',real); if(MODO==='real') Object.assign(DEMO, Real.derivar(real)); }
  save0('tf_lanc3',lanc); save0('tf_pagos',pagos); save0('tf_tetos',tetos); save0('tf_metas',metas); save0('tf_taxameta',taxaMeta);
}
function pintaSync(){
  const el=$('#sync'); if(!el) return; const s=sincStatus;
  const m={off:['','Conectar ao Drive'],go:['go','Sincronizando…'],ok:['ok','Sincronizado '+(s.h||'')],at:['at','Reconectar ao Drive'],ru:['ru','Sem sincronizar'],cfg:['at','Falta configurar o Drive']}[s.t]||['','—'];
  el.className='sync '+m[0]; el.querySelector('span').textContent=m[1]; el.title=s.msg||'Sincronização com o Google Drive';
}
function mudou(){
  capturar();
  clearTimeout(sincTimer); sincTimer=setTimeout(sincronizar,1500);
}
async function sincronizar(){
  if(sincOcupado) return;
  if(MODO==='demo'){ sincStatus={t:'off',msg:'Modo de exemplo: não sincroniza, para não misturar com seus dados reais.'}; pintaSync(); return; }
  if(!Drive.configurado()){ sincStatus={t:'cfg',msg:'Preencha o clientId em config.js (veja o LEIAME).'}; pintaSync(); return; }
  if(!Drive.conectado()){ sincStatus={t:Drive.jaConectou()?'at':'off',msg:'Toque para entrar com a conta Google.'}; pintaSync(); return; }
  sincOcupado=true; sincStatus={t:'go'}; pintaSync();
  try{
    const id=await Drive.garantirArquivo();
    const remoto=await Drive.ler(id);
    const local=capturar();
    const junto=TFSync.semBase(TFSync.juntar(local,remoto));
    const novo=TFSync.montar(TFSync.juntar(BASE,junto));
    if(MODO!=='real' && novo.real){ aplicarEstado(novo); save0('tf_modo','real'); save0('tf_items',junto); sincOcupado=false; location.reload(); return; }
    const mudouTela=!TFSync.igual(novo,estado());
    if(mudouTela){ aplicarEstado(novo); }
    if(!TFSync.igual(junto,remoto)) await Drive.escrever(id,TFSync.doc(junto));
    save0('tf_items',junto);
    sincStatus={t:'ok',h:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),msg:'Dados iguais no Drive e neste aparelho.'};
    if(mudouTela && !['lancar'].includes(atual)) ir(atual);
  }catch(e){
    sincStatus = e.message==='sem-token' ? {t:'at',msg:'A sessão do Google expirou. Toque para reconectar.'} : {t:'ru',msg:'Falhou ('+e.message+'). Seus dados continuam salvos aqui; tentarei de novo.'};
  }
  sincOcupado=false; pintaSync();
}
function chipSync(){ if(!Drive.configurado()||Drive.conectado()) sincronizar(); else Drive.conectar(); }
(function iniciaSync(){
  Drive.lerRetorno();
  const el=$('#sync'); el.onclick=chipSync; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); chipSync(); } };
  capturar(); pintaSync();
  // renovação automática do acesso (1 hora): redireciona sozinho no máximo a cada 2 minutos
  if(Drive.configurado()&&Drive.jaConectou()&&!Drive.conectado()&&Date.now()-(load('tf_gtry',0))>120000&&!/error=/.test(location.hash)){ save0('tf_gtry',Date.now()); Drive.conectar(); return; }
  sincronizar();
  setInterval(()=>{ if(!document.hidden) sincronizar(); },60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) sincronizar(); });
  window.addEventListener('online',sincronizar);
})();

/* ===== Primeira abertura: importar os dados reais ===== */
function telaImportar(){
  return `<div class="head"><div><h1>Bem-vindo ao Tutor Financeiro</h1><div class="sub">Falta trazer os seus números. Eles ficam só neste aparelho e no seu Google Drive.</div></div></div>
  <div class="grid g2">
    ${pn('Importar dados reais',`<div class="small" style="margin-bottom:12px">Escolha o arquivo <b>dados_reais_AAAA-MM-DD.json</b> que está na pasta Financeiro do computador. O app lê o arquivo aqui no aparelho e não envia para nenhum site.</div><input type="file" id="imp_f" accept=".json,application/json"><div class="small" id="imp_m" style="margin-top:12px"></div>`,'teal')}
    ${pn('Já importou em outro aparelho?',`<div class="small">Toque na pílula no topo e entre com a conta Google. Os dados chegam sozinhos pelo Drive.</div><div style="margin-top:14px"><button class="btn ghost" id="imp_demo">Só olhar com dados de exemplo</button></div><div class="hint">O modo de exemplo usa números fictícios e não sincroniza.</div>`,'vio')}
  </div>`;
}
function bindImportar(){
  $('#imp_f').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return; const m=$('#imp_m');
    try{
      const j=JSON.parse(await f.text());
      if(!(j&&j._meta&&j.liquidez&&j.cartao&&j.pendencias_novembro&&j.gastos_fixos_mensais&&j.faturas_futuras_parcelas_antigas&&j.regras_e_metas&&j.entradas_esperadas)) throw new Error('faltam campos');
      Real.derivar(j);
      save0('tf_real',j); save0('tf_modo','real'); location.reload();
    }catch(err){ m.innerHTML='<span class="tag ru">✖ Arquivo não reconhecido</span> Confira se é o dados_reais_*.json ('+err.message+').'; }
  };
  $('#imp_demo').onclick=()=>{ save0('tf_modo','demo'); location.reload(); };
}

/* ===== Navegação ===== */
let atual = 'hoje';
function ir(k){
  atual=k; $('#nav').innerHTML=`<div class="brand"><i>$</i>Tutor Financeiro</div>`+TELAS.map(([id,n,h])=>`<button data-k="${id}" aria-current="${id===k}" style="--h:${hue(h)}">${ic[id]}<span>${n}</span></button>`).join('')+`<div class="demo">${MODO==='real'?'Dados informados por você em '+new Date(DEMO.asOf+'T12:00').toLocaleDateString('pt-BR')+'. Tecle N para lançar.<br><a href="#" id="reimp" style="color:var(--teal)">Reimportar dados</a>':'Dados de exemplo (fictícios). Nada aqui é seu dinheiro real.<br><a href="#" id="reimp" style="color:var(--teal)">Importar dados reais</a>'}</div>`;
  $$('#nav button').forEach(b=>b.onclick=()=>ir(b.dataset.k));
  const ri=$('#reimp'); if(ri) ri.onclick=e=>{ e.preventDefault(); save0('tf_modo',null); location.reload(); };
  if(!MODO){ $('#main').innerHTML=telaImportar(); bindImportar(); return; }
  const scroll=window.scrollY; $('#main').innerHTML=T[k]();
  if(k==='hoje') bindHoje();
  if(k==='lancar') bindLancar();
  if(k==='agenda') bindAgenda();
  if(k==='orcamento') bindOrc();
  if(k==='metas') bindMetas();
  if(k==='cartao'){ drawCartao(); $$('#cts .chip').forEach(b=>b.onclick=()=>{cartSel=b.dataset.c; $$('#cts .chip').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawCartao();}); }
  if(k==='futuro'){ drawFuturo(); $$('#cen .chip[data-c]').forEach(b=>b.onclick=()=>{cenSel=b.dataset.c; $$('#cen .chip[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawFuturo();}); $('#cmp').onclick=()=>{cmpAll=!cmpAll; $('#cmp').setAttribute('aria-pressed',cmpAll); drawFuturo();}; }
  if(k==='decidir'){ drawCalc(); $$('#calcs button').forEach(b=>b.onclick=()=>{calcSel=b.dataset.k; $$('#calcs button').forEach(x=>x.setAttribute('aria-selected',x===b)); drawCalc();}); }
  window.scrollTo(0, ['agenda','orcamento','metas'].includes(k)?scroll:0);
}
const h0=(location.hash||'#hoje').slice(1); ir(h0 in T ? h0 : 'hoje');
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
