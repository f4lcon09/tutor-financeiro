<!doctype html>
<html lang="pt-BR" data-theme="cafe">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://www.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutor Financeiro</title>
<meta name="theme-color" content="#101212">
<script src="tema.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tutor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="tokens.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --p1:var(--card); --p2:var(--surface-2);
  --ln:var(--line); --ln2:var(--line-strong);
  --tx:var(--text); --mu:var(--text-muted);
  --teal:var(--primary); --vio:var(--accent-mix); --pink:var(--accent-warm); --sky:var(--accent-cool);
  --at:var(--attention); --ru:var(--risk);
  --f:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --fn:"Bahnschrift","Segoe UI Variable Display","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,var(--nav-top),var(--nav-bottom));border-right:1px solid var(--card-border);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-family:var(--fn);font-weight:600;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:3px;background:var(--teal);display:grid;place-items:center;color:var(--on-primary);font-style:normal;font-weight:700}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:3px;color:var(--mu);font-size:14.5px;border-left:3px solid transparent}
nav button:hover{background:var(--p2);color:var(--tx)}
nav button[aria-current=true]{background:var(--p2);color:var(--tx);font-weight:600;border-left-color:var(--h,var(--teal))}
nav button[aria-current=true] svg{color:var(--h,var(--teal))}
nav svg{width:19px;height:19px;flex:none}
.demo{margin-top:auto;font-size:12px;color:var(--mu);border:1px dashed var(--ln2);border-radius:3px;padding:10px 12px}
main{padding:14px 32px 70px;max-width:1800px;width:100%}
h1{font-family:var(--fn);font-size:28px;font-weight:600;letter-spacing:.005em}
.sub{color:var(--mu);margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g32{grid-template-columns:2fr 1fr}
.g23{grid-template-columns:1fr 1.6fr}
.pn{background:linear-gradient(180deg,var(--card-top),var(--card-bottom));box-shadow:var(--card-highlight),var(--card-shadow);border:1px solid var(--card-border);border-left:3px solid var(--h,var(--ln2));border-radius:3px;padding:18px 18px 18px 20px;position:relative}
.pn>h2{font-family:var(--fn);font-size:14px;font-weight:600;color:var(--mu);margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.pn>h2 em{font-style:normal;color:var(--h,var(--mu))}
.big{font-family:var(--fn);font-size:34px;font-weight:600;letter-spacing:-.005em;line-height:1.05}
.mid{font-family:var(--fn);font-size:22px;font-weight:600}
.mu{color:var(--mu)} .small{font-size:13px}
.gl{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;fill:currentColor}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:2px;font-size:12.5px;font-weight:600;letter-spacing:.01em}
.ok{color:var(--ok);background:var(--ok-bg)} .at{color:var(--at);background:var(--attention-bg)} .ru{color:var(--ru);background:var(--risk-bg)} .ne{color:var(--mu);background:var(--p2)}
.verdict{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:24px 26px;margin-bottom:14px}
.verdict .ico{width:62px;height:62px;border-radius:3px;display:grid;place-items:center;font-size:30px;font-weight:700}
.verdict h2{font-family:var(--fn);font-size:26px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--p2);margin:10px 0 6px;position:relative}
.bar.uso>span{background:linear-gradient(90deg,var(--bar-from),var(--bar-to))}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--h,var(--teal)) 55%,transparent),var(--h,var(--teal)))}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--ln2);color:var(--mu);font-size:12px;font-style:normal;font-family:var(--fn);font-weight:600;cursor:help;margin-left:7px;position:relative;vertical-align:middle;text-transform:none;letter-spacing:0}
.info:hover,.info:focus{color:var(--tx);border-color:var(--teal);outline:none}
.info:hover::after,.info:focus::after{content:attr(data-t);position:absolute;left:-8px;top:24px;width:270px;background:var(--p2);border:1px solid var(--ln2);padding:10px 12px;border-radius:3px;color:var(--tx);font-size:12.5px;font-family:var(--f);font-weight:400;line-height:1.45;z-index:40;white-space:normal;text-align:left;box-shadow:var(--shadow-pop)}
.info.r:hover::after,.info.r:focus::after{left:auto;right:-8px}
.dica{font-size:13px;border:1px solid var(--ln2);border-left:3px solid var(--teal);border-radius:3px;padding:10px 12px;background:var(--p2);margin:-6px 0 16px}
.dica b{font-family:var(--fn);font-weight:600}
.guia{display:grid;gap:12px}
.guia .g{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding-top:12px;border-top:1px solid var(--ln)}
.guia .g:first-child{border-top:0;padding-top:0}
.pn.click{cursor:pointer;transition:border-color .15s}
.pn.click:hover{border-color:var(--h)}
.strip .c{cursor:pointer}
.strip .c:hover{border-color:var(--mu)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--p2)}
input[type=range]{display:block;width:100%;max-width:100%;margin:0;padding:0;height:32px;min-height:32px;background:transparent;border:0;accent-color:var(--h,var(--teal))}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px !important}
input[type=date]{display:block;line-height:1.2}
.g-dp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.g-dp>.field{min-width:0}
.secw{display:contents}.maisbtn{display:none}
.sl{margin-bottom:16px}
.sl label{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl label span{min-width:0}
.sl label b{flex:none;white-space:nowrap;font-family:var(--fn);color:var(--tx)}
.tip{position:fixed;z-index:30;background:var(--p2);border:1px solid var(--ln2);border-radius:3px;padding:9px 12px;font-size:12.5px;pointer-events:none;box-shadow:var(--shadow-pop)}
.tip b{font-family:var(--fn);font-weight:600;display:block;margin-bottom:4px}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.bar>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.8}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--ln)}
.ins:first-of-type{border-top:0;padding-top:0}
.ins .d{width:30px;height:30px;border-radius:3px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=number],input[type=date],select{min-width:0;width:100%;min-height:44px;-webkit-appearance:none;appearance:none;background:var(--p2);border:1px solid var(--ln2);border-radius:3px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--h,var(--teal))}
button:focus-visible,.chip:focus-visible,nav button:focus-visible,.sync:focus-visible,[tabindex]:focus-visible,summary:focus-visible,input[type=checkbox]:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input[type=number]{font-family:var(--fn);font-size:16px}
.rate{display:grid;grid-template-columns:1fr 112px;gap:8px}
.hint{font-size:12.5px;color:var(--mu);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;min-height:44px;padding:7px 14px;border-radius:99px;border:1px solid var(--ln2);color:var(--mu);font-size:14px}
.chip:hover{color:var(--tx)}
.chip[aria-pressed=true]{background:var(--primary-tonal);border-color:var(--h,var(--teal));color:var(--tx);font-weight:600}
.seg{display:inline-flex;background:var(--p1);border:1px solid var(--ln);border-radius:3px;margin-bottom:18px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:9px 16px;color:var(--mu);font-weight:500;border-right:1px solid var(--ln)}
.seg button:last-child{border-right:0}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--primary-tonal);color:var(--tx);box-shadow:inset 0 -2px 0 var(--h,var(--teal));font-weight:600}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--h,var(--teal));color:var(--on-primary);font-family:var(--fn);font-weight:600;padding:11px 20px;border-radius:3px;text-align:center}
.btn:hover{filter:brightness(1.1)}
/* caixa de seleção: vazia fica com borda visível; área de toque de 44px sem aumentar o desenho */
input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;width:24px;height:24px;flex:none;margin:0;background:var(--p1);border:2px solid var(--mu);border-radius:5px;cursor:pointer;display:inline-block;vertical-align:middle}
input[type=checkbox]::before{content:'';position:absolute;inset:-10px}
input[type=checkbox]:checked{background:var(--h,var(--teal));border-color:var(--h,var(--teal))}
input[type=checkbox]:checked::after{content:'';position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--on-primary);border-width:0 3px 3px 0;transform:rotate(45deg)}
.linha-check{display:flex;align-items:center;gap:12px;min-height:44px}.linha-check label{margin:0}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln2)}
.toggle{display:flex;gap:10px}
.toggle label{flex:1;display:flex;align-items:center;gap:8px;margin:0;background:var(--p2);border:1px solid var(--ln2);border-radius:3px;padding:10px 12px;cursor:pointer;color:var(--tx);font-size:14px}
.toggle input{--h:var(--teal)}
.toggle label{min-height:44px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--fn);font-size:12px;color:var(--mu);font-weight:500;text-align:left;padding:8px 8px;border-bottom:1px solid var(--ln2)}
td{padding:10px 8px;border-bottom:1px solid var(--ln)}
td.n,th.n{text-align:right;font-family:var(--fn);font-size:15px}
tr:last-child td{border-bottom:0}
.x{all:unset;cursor:pointer;color:var(--mu);min-width:44px;min-height:44px;display:inline-grid;place-items:center;box-sizing:border-box;border-radius:3px}.x:hover{background:var(--risk-bg);color:var(--ru)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mu)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.res{background:var(--p2);border-radius:3px;border-left:3px solid var(--h,var(--teal));padding:16px 18px;margin-bottom:16px}
.res .big{margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--mu)} .kv span:nth-child(even){text-align:right;font-family:var(--fn);font-size:15px}
svg text{font-family:var(--f)}
.disc{font-size:12.5px;color:var(--mu);border-left:2px solid var(--ln2);padding:2px 0 2px 12px;margin-top:14px}
.factor{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--ln)}
.factor:first-of-type{border-top:0}
.factor .bar{grid-column:1/-1;margin:2px 0 0;height:6px}
/* faixa do mês */
.strip{display:grid;gap:3px}
.strip .c{height:38px;border-radius:2px;background:var(--p2);position:relative;border:1px solid transparent}
.strip .c{cursor:pointer;transition:transform .12s,box-shadow .12s}
.strip .c:hover{box-shadow:0 0 0 1px var(--mu);transform:translateY(-2px)}
.strip .c.hj{border-color:var(--tx)}
.strip .c.sel{box-shadow:0 0 0 2px var(--teal);transform:translateY(-3px);z-index:2}
.strip .c.sel::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-4px;border:4px solid transparent;border-top:0;border-bottom:5px solid var(--teal)}
.strip .l.sel{color:var(--teal);font-weight:700}
tr.clk.sel td{background:var(--p2)}
tr.clk.sel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.strip .c.fut{background:transparent;border:1px dashed var(--ln2)}
.strip .c b{position:absolute;left:50%;top:5px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--vio)}
.strip .l{font-family:var(--fn);font-size:12px;color:var(--mu);text-align:center;margin-top:4px}
.strip .l span{display:none}.strip .l span.key{display:inline}
/* cartão */
.card3d{border-radius:6px;padding:20px;background:var(--p2);border:1px solid var(--ln2);position:relative;overflow:hidden;min-height:170px}
.card3d .chip2{width:38px;height:28px;border-radius:5px;border:1px solid var(--ln2);background:var(--p1);margin-bottom:18px}
.cardnum{letter-spacing:.15em}
.card3d>*{position:relative;z-index:1}
.card3d:after{z-index:0;content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:26px solid var(--p2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{font-family:var(--fn);font-size:12px;color:var(--mu);text-align:center;letter-spacing:.08em;padding-bottom:2px}
.cal .d{min-height:56px;border:1px solid var(--ln);border-radius:2px;padding:4px 6px;font-family:var(--fn);font-size:12px;color:var(--mu)}
.cal .d.hj{border-color:var(--tx);color:var(--tx)}
.cal .d.v{background:var(--p2)}
.cal .d b{display:block;font-weight:500;font-size:12px;color:var(--vio);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .d b.pg{color:var(--ok)}
.vb{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:8px}
.vb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.vb>div>span{width:100%;border-radius:2px 2px 0 0;background:var(--h,var(--vio))}
.vb small{font-family:var(--fn);font-size:12px;color:var(--mu)}
.vb em{font-style:normal;font-family:var(--fn);font-size:12px}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 26px}
.gl b{display:block;font-family:var(--fn);font-weight:600;letter-spacing:.02em}
.screen{display:none}.screen.on{display:block}
.col{min-width:0}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 32px 0}
.ibtn{all:unset;box-sizing:border-box;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--mu);border:1px solid transparent}
.ibtn:hover{color:var(--tx);border-color:var(--ln2)}
.ibtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ibtn svg{width:22px;height:22px}
.ibtn.tonal{border-color:var(--ln2);color:var(--tx);background:var(--primary-tonal)}
.x svg{width:20px;height:20px}
#menutema{position:fixed;z-index:50;min-width:200px;background:var(--p1);border:1px solid var(--ln2);border-radius:16px;padding:6px;box-shadow:var(--shadow-pop)}
#menutema button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border-radius:12px;cursor:pointer;color:var(--tx)}
#menutema button:hover{background:var(--p2)}
#menutema button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
#menutema button[aria-checked=true]{background:var(--primary-tonal)}
#menutema .sw{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid var(--ln2);background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
#menutema .nm{flex:1}
#menutema .ck{width:20px;height:20px;color:var(--teal)}
#menutema .ck svg{width:20px;height:20px}
#imp_f{display:block;width:100%;max-width:100%;min-width:0}
.selo{all:unset;box-sizing:border-box;margin-right:auto;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:22px;background:var(--attention-bg);color:var(--at);font-family:var(--fn);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.selo:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sync svg{display:none;width:22px;height:22px}
.sync b{display:none}
.sync{position:static;display:inline-flex;align-items:center;gap:7px;min-height:32px;font-family:var(--fn);font-size:12px;letter-spacing:.02em;color:var(--mu);background:var(--p1);border:1px solid var(--ln2);border-radius:14px;padding:6px 12px;cursor:pointer;user-select:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.sync.ok i{background:var(--ok)} .sync.at i{background:var(--at)} .sync.ru i{background:var(--ru)} .sync.go i{background:var(--sky);animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.3}}
.sync:hover{border-color:var(--teal);color:var(--tx)}
/* celular: blocos recolhíveis, alertas, mini-números */
.det{border:1px solid var(--ln);border-left:3px solid var(--h,var(--ln2));border-radius:3px;background:var(--p1);margin-bottom:14px}
.det>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;font-family:var(--fn);font-size:14px;font-weight:600;letter-spacing:.02em}
.det>summary::-webkit-details-marker{display:none}
.det>summary::after{content:'▾';color:var(--mu);font-size:16px}
.det[open]>summary::after{content:'▴'}
.det>.detc{padding:0 12px 12px}
.det>.detc>.pn,.det>.detc>.grid,.det>.detc>.det{margin-bottom:12px}
.alertas{display:grid;gap:8px;margin-bottom:12px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:3px;font-size:14px;font-weight:600;line-height:1.3}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mini{background:var(--p1);border:1px solid var(--ln);border-radius:3px;padding:10px;min-width:0}
.mini b{display:block;font-family:var(--fn);font-size:18px;font-weight:600}
.conf{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.confc{width:100%;max-width:420px;box-sizing:border-box;background:var(--p1);border:1px solid var(--ln2);border-radius:6px;padding:18px 16px}
.confc h2{margin:0 0 8px;font-size:18px}
.confc p{margin:0 0 16px}
.confb{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.confb .btn{min-height:44px}
.linkbtn{all:unset;cursor:pointer;color:var(--teal);text-decoration:underline;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;box-sizing:border-box}
.clas{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin-bottom:14px;padding:0 12px;border:1px solid var(--ln2);border-radius:3px;background:var(--p2)}
